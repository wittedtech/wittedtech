name: Update Dev.to Blog Posts

# Replaces gautamkrishnar/blog-post-workflow. That action reads the RSS feed,
# which is chronological only — it cannot rank by engagement. The Dev.to API
# exposes reaction and comment counts, so .github/scripts/update_readme_sections.py
# sorts on those and writes three tiers between the BLOG-POST-LIST markers.
on:
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Rank Dev.to posts by engagement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild blog section
        run: python .github/scripts/update_readme_sections.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "No change to README.md"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh Dev.to posts ranked by engagement"
          git push
