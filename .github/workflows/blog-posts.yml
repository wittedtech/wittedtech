name: Update Dev.to Blog Posts

# Was previously broken: the job never ran because `with:` sat at column 0.
on:
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Pull latest Dev.to posts into README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/wittedtech-by-harshit"
          max_post_count: 5
          readme_path: ./README.md
          template: "- [$title]($url)\n"
          commit_message: "chore: sync latest Dev.to posts"
